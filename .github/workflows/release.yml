name: Release

# A pushed version tag is the only trigger: the tag is the one input that
# cannot be edited afterwards, and the draft release lets the maintainer review
# the installer before anyone can download it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  release:
    name: release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Installs the toolchain rust-toolchain.toml pins, components included.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: tag matches every manifest
        run: npm run version:check -- "${{ github.ref_name }}"
      # beforeBuildCommand runs `npm run build`; --bundles nsis produces the
      # currentUser installer configured in tauri.conf.json.
      - name: build the installer
        run: npm run tauri build -- --bundles nsis
      - name: stage the installer
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          installer="$(ls src-tauri/target/release/bundle/nsis/*.exe | head -n 1)"
          mkdir -p release-assets
          cp "$installer" "release-assets/SAS-Launcher-${version}-x64-Setup.exe"
          ls -l release-assets
      - name: create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            # A re-run after a failed step must not fail on the release it
            # created last time.
            echo "release $tag already exists, reusing it"
            exit 0
          fi
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          gh release create "$tag" \
            --draft \
            --title "SAS Launcher ${version}" \
            --generate-notes
      # The generated notes come first, then the warning that users of an
      # unsigned installer actually need to read.
      - name: append the unsigned installer note
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          {
            gh release view "$tag" --json body --jq .body
            printf '\n\n> [!IMPORTANT]\n'
            printf '> This installer is unsigned. Windows SmartScreen will warn when you run it:\n'
            printf '> choose "More info" and then "Run anyway" only if you trust this build.\n'
          } > release-notes.md
          gh release edit "$tag" --notes-file release-notes.md
      - name: upload the installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" release-assets/*.exe --clobber
