name: Feature request
description: A workflow SAS Launcher should make easier.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do today, and where it costs you time.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behaviour that would fix it. A rough idea is enough.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including anything you do by hand today.
    validations:
      required: false
  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and the README.
          required: true
        - label: I can help test this on a machine with SAS 9.4 installed.
          required: false
